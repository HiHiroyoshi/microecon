[tool.poetry]
name = "microecon"
version = "0.2.0"
description = "型安全かつ直感的にミクロ経済学の基礎理論を計算・可視化するための教育・実務向けPythonライブラリ"
authors = ["HiHiroyoshi"]
readme = "README.md"
packages = [{ include = "microecon" }]

[tool.poetry.dependencies]
python = "^3.12"
sympy = "^1.12"
matplotlib = "^3.9"
numpy = "^1.26"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
mypy = "^1.10"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["sympy.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
